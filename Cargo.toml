[workspace]
resolver = "2"
members = [
    "crates/openkeito-model",
    "crates/openkeito-core",
    "crates/openkeito-cli",
    "crates/openkeito-py",
    "crates/openkeito-wasm",
]

[workspace.package]
version = "0.11.0"
edition = "2021"
# The oldest toolchain that `cargo check --workspace` was run with; the
# dependencies ask for it (pyo3, clap).
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["The OpenKeito contributors"]
repository = "https://github.com/yutanakamurajp/OpenKeito"
keywords = ["power-systems", "emt", "simulation", "circuit", "transients"]
categories = ["science", "simulation"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
num-complex = "0.4"
rayon = "1"
faer = { version = "0.24", default-features = false, features = ["std", "sparse-linalg"] }
# The version of wasm-bindgen is exact: the command wasm-bindgen that writes
# the JavaScript glue must be the same version (crates/openkeito-wasm/README.md).
wasm-bindgen = "=0.2.130"
js-sys = "0.3"
# The crates of the workspace: path for the build here, version for crates.io
# (a dependency by path alone is refused there). A release changes these with
# `version` above (AGENTS.md, "Versions and releases").
openkeito-model = { path = "crates/openkeito-model", version = "0.11.0" }
openkeito-core = { path = "crates/openkeito-core", version = "0.11.0" }
openkeito-cli = { path = "crates/openkeito-cli", version = "0.11.0", default-features = false }

# Tests run long simulations and the sparse LU, whose generic code is
# compiled in the crates that use it; without optimization they take 5 times
# longer.
[profile.test]
opt-level = 1
