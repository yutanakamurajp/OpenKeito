[package]
name = "openkeito-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
description = "OpenKeito for the browser: validate, run and scan models in memory (WebAssembly)"
publish = false

[lib]
# cdylib: the .wasm file. rlib: the tests on the build machine.
crate-type = ["cdylib", "rlib"]

[dependencies]
# Without `native`: no argument parsing, no thread pool, no batch.
openkeito-cli.workspace = true
openkeito-core.workspace = true
openkeito-model.workspace = true
serde_json.workspace = true
wasm-bindgen.workspace = true
js-sys.workspace = true
